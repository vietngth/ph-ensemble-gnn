[project]
name = "phgnn"
version = "0.2.0"
description = "Persistent homology-induced graph ensembles for seismic intensity regression"
readme = "README.md"
license = {text = "MIT"}
requires-python = "~=3.11.0"
dependencies = [
    "torch==2.5.1",
    "lightning==2.5.0",
    "torch_geometric>=2.6",
    "scikit-learn==1.7.2",
    "numpy",
    "pyyaml",
    "scipy",
]

[project.optional-dependencies]
test = ["pytest"]
ph = ["gudhi>=3.8", "geopy>=2.0"]  # experiments/build_ph_graphs.py (Vietoris-Rips persistence, WGS84 geodesics)

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["phgnn*"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
